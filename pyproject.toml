[project]
name = "dnctree"
authors = [
    {name = "Lars Arvestad", email = "arve@math.su.se"},
    {name = "Amy Lee Jalenius", email = "amy.jalsenius@gmail.com"},
]
maintainers = [
    {name = "Lars Arvestad", email = "arve@math.su.se"},
]
description = "Distance-based phylogeny inference using a randomised divide-and-conquer method"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dynamic = ["version"]

dependencies = [
    "alv>=1.5",
    "modelmatcher>=1.1.3",
    "biopython>=1.81",
    "ete3>=3.1.1",
    "tree_matching_distance>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]


[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"


[project.scripts]
dnctree = "dnctree.main:main"


[project.urls]
homepage = "https://github.com/arvestad/dnctree"


[tool.setuptools]
packages = ["dnctree"]

[tool.setuptools_scm]
version_file = "dnctree/_version.py"


[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
